<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Rogue Directive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05080f; --bg2:#0a111d; --card:#0e1727; --line:rgba(90,169,230,.16);
  --accent:#5aa9e6; --accent2:#8fd0ff; --text:#e6eef8; --dim:#7f92a8; --ok:#5fd0a0;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#020408;overflow:hidden}
body{font-family:'Poppins',system-ui,sans-serif;color:var(--text)}
#wrap{position:fixed;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#020408}
#stage{position:relative;width:1920px;height:1080px;flex:none;overflow:hidden;background:radial-gradient(1200px 700px at 30% 45%,#0d1a2e 0%,var(--bg) 65%);transform-origin:center center}
#bgc{position:absolute;left:0;top:0;width:1920px;height:1080px}
.streaks{position:absolute;left:-200px;top:-200px;width:2320px;height:1480px;overflow:hidden;pointer-events:none}
.streak{position:absolute;top:-300px;width:2px;height:1900px;background:linear-gradient(to bottom,transparent,rgba(90,169,230,.22),transparent);transform:rotate(24deg);animation:drift 14s linear infinite}
@keyframes drift{from{margin-left:-400px;opacity:0}20%{opacity:1}80%{opacity:1}to{margin-left:500px;opacity:0}}
.vign{position:absolute;left:0;top:0;width:100%;height:100%;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.6) 100%);pointer-events:none}
.grid{position:absolute;left:0;top:0;width:100%;height:100%;opacity:.5;background-image:linear-gradient(rgba(90,169,230,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(90,169,230,.05) 1px,transparent 1px);background-size:60px 60px}

/* Top bar */
.top{position:absolute;left:80px;right:80px;top:56px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.brand{display:flex;align-items:center;gap:14px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:pulse 1.6s ease-in-out infinite}
.brand b{font-weight:700;letter-spacing:.22em;font-size:17px;text-transform:uppercase}
.brand span{color:var(--dim);font-size:15px;letter-spacing:.04em}
.chips{display:flex;gap:12px}
.chip{display:flex;align-items:center;gap:10px;background:rgba(14,23,39,.85);border:1px solid var(--line);border-radius:999px;padding:9px 20px;font-size:15px;color:var(--dim)}
.chip b{color:var(--text);font-weight:600}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}

/* Logo block */
.hero{position:absolute;left:80px;top:170px;width:820px;height:640px;z-index:3}
.logoWrap{position:absolute;left:40px;top:40px;width:430px;height:430px}
.halo{position:absolute;left:-90px;top:-90px;width:610px;height:610px;border-radius:50%;background:radial-gradient(circle,rgba(90,169,230,.32) 0%,rgba(90,169,230,.08) 45%,transparent 70%);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.08);opacity:1}}
.orbit{position:absolute;border-radius:50%;border:1px solid rgba(90,169,230,.35)}
.o1{left:-40px;top:-40px;width:510px;height:510px;animation:spin 26s linear infinite}
.o2{left:-90px;top:-90px;width:610px;height:610px;border-style:dashed;border-color:rgba(90,169,230,.18);animation:spin 60s linear infinite reverse}
.orbit i{position:absolute;left:50%;top:-5px;width:9px;height:9px;margin-left:-4px;border-radius:50%;background:var(--accent2);box-shadow:0 0 14px var(--accent2)}
.o2 i{top:auto;bottom:-5px;background:var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}
.fx,.fy,.fr{position:absolute;left:0;top:0;width:430px;height:430px}
.fx{animation:flyX 9s ease-in-out infinite}
.fy{animation:flyY 5.5s ease-in-out infinite}
.fr{animation:flyR 7s ease-in-out infinite}

@keyframes flyX{0%,100%{transform:translateX(0)}25%{transform:translateX(26px)}75%{transform:translateX(-26px)}}
@keyframes flyY{0%,100%{transform:translateY(6px)}50%{transform:translateY(-24px)}}

.title{position:absolute;left:0;top:500px}
.title h1{margin:0;font-size:64px;line-height:1;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.title h1 em{font-style:normal;color:var(--accent)}
.title p{margin:14px 0 0;font-size:19px;color:var(--dim);letter-spacing:.32em;text-transform:uppercase;font-weight:500}

/* Right panel */
.panel{position:absolute;right:80px;top:170px;width:780px;z-index:4;display:flex;flex-direction:column;gap:22px}
.card{background:linear-gradient(160deg,rgba(16,27,46,.92),rgba(10,16,28,.92));border:1px solid var(--line);border-radius:20px;padding:28px 32px}
.lbl{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);font-weight:600}
.big{display:flex;align-items:flex-end;justify-content:space-between;margin-top:6px}
.pct{font-size:104px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;background:linear-gradient(180deg,#fff,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.pct small{font-size:44px;color:var(--accent);-webkit-text-fill-color:var(--accent);margin-left:4px}
.files{text-align:right;padding-bottom:10px}
.files b{display:block;font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;font-family:'JetBrains Mono',monospace}
.files span{font-size:14px;color:var(--dim);letter-spacing:.06em}
.bar{position:relative;height:14px;border-radius:999px;background:#0a1220;border:1px solid var(--line);overflow:hidden;margin-top:18px}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:linear-gradient(90deg,#2f7fc4,var(--accent),var(--accent2));box-shadow:0 0 18px rgba(90,169,230,.6)}
.fill:after{content:"";position:absolute;right:0;top:0;bottom:0;width:80px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7));animation:glint 1.4s ease-in-out infinite}
@keyframes glint{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
.stripes{position:absolute;left:0;top:0;right:0;bottom:0;background:repeating-linear-gradient(115deg,transparent 0 10px,rgba(0,0,0,.28) 10px 14px)}
.steps{display:flex;gap:10px;margin-top:22px}
.step{flex:1;font-size:13px;color:var(--dim);border-top:2px solid #16223a;padding-top:10px;transition:all .4s;letter-spacing:.03em}
.step.on{color:var(--text);border-top-color:var(--accent)}
.step.done{color:var(--dim);border-top-color:#2c5f8a}
.step.done:before{content:"\2713  ";color:var(--ok)}
.step.on:before{content:"\25CF  ";color:var(--accent);animation:pulse 1s infinite}

.log{margin-top:16px;font-family:'JetBrains Mono',monospace;font-size:15px;height:160px;overflow:hidden;position:relative}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim);padding:3px 0;animation:in .35s ease-out}
.log div b{color:var(--accent);font-weight:500;margin-right:12px}
.log div:last-child{color:var(--text)}
.log:before{content:"";position:absolute;left:0;right:0;top:0;height:60px;background:linear-gradient(#0e1727,transparent);z-index:2}
.logIn{position:absolute;left:0;right:0;bottom:0}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Tip */
.tip{display:flex;gap:22px;align-items:center;min-height:118px}
.tipIc{flex:none;width:54px;height:54px;border-radius:16px;background:rgba(90,169,230,.12);border:1px solid rgba(90,169,230,.3);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);font-size:22px}
.tipTx{transition:opacity .4s,transform .4s}
.tipTx.out{opacity:0;transform:translateY(6px)}
.tipTx h4{margin:0 0 6px;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:600}
.tipTx p{margin:0;font-size:19px;line-height:1.5;color:var(--text);font-weight:400}

/* Zones strip */
.zones{position:absolute;left:80px;right:80px;bottom:78px;z-index:4}
.zones .lbl{margin-bottom:14px;display:flex;justify-content:space-between}
.zrow{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.z{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;transition:all .5s;overflow:hidden}
.z b{display:block;font-size:17px;font-weight:600;color:var(--dim);transition:color .5s}
.z span{font-size:13px;color:#4f6178;letter-spacing:.08em;text-transform:uppercase}
.z:after{content:"";position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--accent);transition:width 1s}
.z.on{border-color:rgba(90,169,230,.55);background:linear-gradient(160deg,#122540,#0e1727);transform:translateY(-6px);box-shadow:0 14px 30px rgba(90,169,230,.15)}
.z.on b{color:var(--text)}
.z.on:after{width:100%}

.foot{position:absolute;left:80px;right:80px;bottom:30px;display:flex;justify-content:space-between;font-size:13px;color:#4f6178;letter-spacing:.14em;text-transform:uppercase;z-index:4}
.foot .key{color:var(--dim)}
.foot kbd{font-family:'JetBrains Mono',monospace;background:#0e1727;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--text);margin:0 4px}

/* bottom edge progress */
.edge{position:absolute;left:0;bottom:0;height:5px;width:0;background:linear-gradient(90deg,#2f7fc4,var(--accent2));box-shadow:0 0 20px var(--accent);z-index:6}

/* Demo controls (mockup only) */
.demo[hidden]{display:none}
.demo{position:fixed;right:14px;top:14px;z-index:20;display:flex;gap:8px;font-family:'Poppins',sans-serif}
.demo button{background:rgba(14,23,39,.9);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit}
.demo button:hover{border-color:var(--accent)}
.demo button:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.demo button.act{background:var(--accent);color:#04101c;border-color:var(--accent);font-weight:600}
@media (prefers-reduced-motion:reduce){.fx,.fy,.fr,.halo,.orbit,.wind,.streak{animation:none}}
</style></head><body>

<div id="wrap">
<div id="stage">
  <div class="grid"></div>
  <canvas id="bgc" width="1920" height="1080"></canvas>
  <div class="streaks" id="streaks"></div>
  <div class="vign"></div>

  <div class="top">
    <div class="brand"><div class="dot"></div><b>Rogue Directive</b><span>PvE &amp; PvP Ops</span></div>
    <div class="chips">
      <div class="chip">Map <b id="mapName">...</b></div>
      <div class="chip">Slots <b id="plys">...</b></div>
      <div class="chip">Mode <b>Redzone</b></div>
    </div>
  </div>

  <div class="hero">
    <div class="wind" style="left:560px;top:90px;width:140px;animation-delay:-0.2s;animation-duration:2.4s"></div><div class="wind" style="left:600px;top:190px;width:200px;animation-delay:-1.1s;animation-duration:3.0s"></div><div class="wind" style="left:540px;top:300px;width:120px;animation-delay:-0.7s;animation-duration:2.2s"></div><div class="wind" style="left:610px;top:390px;width:170px;animation-delay:-1.9s;animation-duration:2.8s"></div><div class="wind" style="left:580px;top:140px;width:100px;animation-delay:-2.1s;animation-duration:2.5s"></div><div class="wind" style="left:560px;top:350px;width:150px;animation-delay:-0.4s;animation-duration:3.2s"></div>
    <div class="logoWrap">
      <div class="halo"></div>
      <div class="orbit o2"><i></i></div>
      <div class="orbit o1"><i></i></div>
      <div class="fx"><div class="fy"><div class="fr"><div class="logo"></div></div></div></div>
    </div>
    <div class="title">
      <h1>Bienvenue, <em>opérateur</em></h1>
      <p>Prépare ton équipement</p>
    </div>
  </div>

  <div class="panel">
    <div class="card">
      <div class="lbl">Déploiement en cours</div>
      <div class="big">
        <div class="pct"><span id="pct">0</span><small>%</small></div>
        <div class="files"><b id="files">0 / 0</b><span id="filesLbl">fichiers synchronisés</span></div>
      </div>
      <div class="bar"><div class="fill" id="fill"><div class="stripes"></div></div></div>
      <div class="steps" id="steps"></div>
      <div class="log"><div class="logIn" id="log"></div></div>
    </div>
    <div class="card tip">
      <div class="tipIc">?</div>
      <div class="tipTx" id="tipTx"><h4 id="tipH">Redzone</h4><p id="tipP"></p></div>
    </div>
  </div>

  <div class="zones">
    <div class="lbl"><span>Zones redzone en rotation</span><span id="zlbl">Vote toutes les 15 minutes</span></div>
    <div class="zrow" id="zrow"></div>
  </div>
  <div class="foot"><span>discord.gg/9hhhadhwAU</span><span class="key">Appuie sur<kbd>F1</kbd>pour l'aide en jeu</span></div>
  <div class="edge" id="edge"></div>
</div>
</div>

<div class="demo" id="demoBox" hidden>
  <button id="bRestart">Rejouer</button>
  <button id="bSlow">Lent</button>
  <button id="bFast" class="act">Normal</button>
</div>

<script>
(function(){
  var stage=document.getElementById('stage');
  function fit(){
    var s=Math.min(window.innerWidth/1920,window.innerHeight/1080);
    stage.style.transform='scale('+s+')';
  }
  window.addEventListener('resize',fit);fit();

  var st=document.getElementById('streaks'),h='',i;
  for(i=0;i<9;i++){h+='<div class="streak" style="left:'+(i*260)+'px;animation-delay:-'+(i*1.7)+'s;animation-duration:'+(12+i%4*3)+'s"></div>';}
  st.innerHTML=h;

  var c=document.getElementById('bgc'),x=c.getContext('2d'),P=[];
  for(i=0;i<70;i++)P.push({x:Math.random()*1920,y:Math.random()*1080,r:Math.random()*1.8+.4,v:Math.random()*.35+.08,a:Math.random()*.5+.15});
  function draw(){
    x.clearRect(0,0,1920,1080);
    for(var k=0;k<P.length;k++){
      var p=P[k];p.y-=p.v;p.x+=p.v*.4;
      if(p.y<-5){p.y=1085;p.x=Math.random()*1920}
      if(p.x>1925)p.x=-5;
      x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);
      x.fillStyle='rgba(143,208,255,'+p.a+')';x.fill();
    }
    setTimeout(draw,33);
  }
  draw();

  var STEPS=['Connexion','Données','Ressources','Map','Prêt'];
  var TIPS=[
    ['Redzone','Un vote de 30 secondes désigne la prochaine zone. Plus une zone a de votes, plus elle a de chances d\'être tirée.'],
    ['Coins','Tes kills dans la sphère rapportent des coins Redzone. Ils sont conservés d\'une session à l\'autre.'],
    ['Véhicules','Chaque zone a son propre véhicule. Approche du PNJ pour le sortir, puis appuie sur H pour le rappeler.'],
    ['Boutique','Dépense tes coins dans la boutique pour débloquer de nouveaux équipements.'],
    ['Respawn','Après une mort, tu réapparais au point de départ de la zone en cours.'],
    ['Équipe','Reste groupé. Les zones sont larges et les embuscades viennent de partout.']
  ];
  var ZONES=[['Commissariat','Zone 1'],['Burger King','Zone 2'],['Mécano','Zone 3'],['Zone résidentielle','Zone 4'],['Autoroute','Zone 5'],['Zone industrielle','Zone 6']];
  var LOGS=[
    ['CONN','Connexion au serveur établie'],
    ['AUTH','Vérification de ton profil Steam'],
    ['SYNC','Synchronisation des menus'],
    ['SYNC','Préparation du HUD'],
    ['SYNC','Chargement de la boutique'],
    ['SYNC','Chargement des menus et du lobby'],
    ['SYNC','Préparation des zones redzone'],
    ['SYNC','Chargement du système de vote'],
    ['SYNC','Chargement des véhicules'],
    ['SYNC','Chargement des équipements et des armes'],
    ['SYNC','Initialisation des sons et des effets'],
    ['MAP ','Chargement de la carte'],
    ['MAP ','Mise en place des entités'],
    ['OK  ','Presque prêt']
  ];
  var stepsEl=document.getElementById('steps'),zrow=document.getElementById('zrow');
  stepsEl.innerHTML=STEPS.map(function(s){return '<div class="step">'+s+'</div>'}).join('');
  zrow.innerHTML=ZONES.map(function(z){return '<div class="z"><b>'+z[0]+'</b><span>'+z[1]+'</span></div>'}).join('');
  var stepEls=stepsEl.children,zEls=zrow.children;

  var pctEl=document.getElementById('pct'),fill=document.getElementById('fill'),filesEl=document.getElementById('files'),
      filesLbl=document.getElementById('filesLbl'),edge=document.getElementById('edge'),logEl=document.getElementById('log');

  var total=0,needed=0,statusFloor=0,target=0,shown=0,logIdx=0,tipIdx=0,zIdx=0;
  var realMode=false,demo=null,demoSpeed=1;

  function computeTarget(){
    var t=statusFloor;
    if(total>0){
      var f=(total-needed)/total;
      if(f<0)f=0;
      if(f>1)f=1;
      t=Math.max(t,.1+f*.75);
    }
    return t>1?1:t;
  }
  function render(){
    var v=Math.round(shown*100);
    pctEl.textContent=v;
    fill.style.width=(shown*100)+'%';edge.style.width=(shown*100)+'%';
    if(total>0){filesEl.textContent=(total-needed)+' / '+total;filesLbl.textContent='fichiers synchronisés';}
    else{filesEl.textContent=v+' %';filesLbl.textContent='préparation en cours';}
    var cur=shown<.08?0:shown<.6?1:shown<.8?2:shown<.95?3:4;
    for(var k=0;k<stepEls.length;k++){stepEls[k].className='step'+(k<cur?' done':k===cur?' on':'');}
    if(shown>=.999)stepEls[4].className='step done';
    // journal generique cale sur la progression : jamais de vrais noms de fichiers
    var want=Math.min(LOGS.length,Math.floor(shown*LOGS.length)+1);
    while(logIdx<want){
      var l=LOGS[logIdx++],d=document.createElement('div');
      d.innerHTML='<b>'+l[0]+'</b>'+l[1];
      logEl.appendChild(d);
      while(logEl.children.length>6)logEl.removeChild(logEl.firstChild);
    }
  }
  function loop(){
    target=computeTarget();
    if(shown<target){shown+=(target-shown)*.12+.0006;if(shown>target)shown=target;}
    else if(shown>target+.03){shown+=(target+.03-shown)*.08;}
    else if(realMode&&shown<.97){shown+=.00025;}
    render();
    setTimeout(loop,60);
  }

  function showTip(){
    var tx=document.getElementById('tipTx');tx.className='tipTx out';
    setTimeout(function(){
      tipIdx=(tipIdx+1)%TIPS.length;
      document.getElementById('tipH').textContent=TIPS[tipIdx][0];
      document.getElementById('tipP').textContent=TIPS[tipIdx][1];
      tx.className='tipTx';
    },400);
  }
  function showZone(){
    for(var k=0;k<zEls.length;k++)zEls[k].className='z'+(k===zIdx?' on':'');
    zIdx=(zIdx+1)%zEls.length;
  }
  document.getElementById('tipH').textContent=TIPS[0][0];document.getElementById('tipP').textContent=TIPS[0][1];
  showZone();
  setInterval(showTip,5500);
  setInterval(showZone,2600);

  function stopDemo(){if(demo){clearTimeout(demo);demo=null;}}
  function goReal(){
    if(!realMode){realMode=true;stopDemo();}
  }
  // callbacks appeles par GMod
  window.GameDetails=function(servername,serverurl,mapname,maxplayers,steamid,gamemode){
    goReal();
    if(mapname)document.getElementById('mapName').textContent=mapname;
    if(maxplayers)document.getElementById('plys').textContent=maxplayers;
  };
  window.SetFilesTotal=function(n){goReal();total=parseInt(n,10)||0;};
  window.SetFilesNeeded=function(n){goReal();needed=parseInt(n,10)||0;};
  window.DownloadingFile=function(name){goReal();}; // volontairement ignore : aucun nom de fichier affiche
  window.SetStatusChanged=function(status){
    goReal();
    var s=String(status||'').toLowerCase(),f=statusFloor;
    if(s.indexOf('retriev')>-1)f=.04;
    else if(s.indexOf('sending')>-1||s.indexOf('client info')>-1)f=.08;
    else if(s.indexOf('mount')>-1||s.indexOf('workshop')>-1)f=.6;
    else if(s.indexOf('lua')>-1||s.indexOf('starting')>-1)f=.85;
    else if(s.indexOf('complete')>-1||s.indexOf('sent')>-1||s.indexOf('ready')>-1)f=.93;
    if(f>statusFloor)statusFloor=f;
  };

  // simulation : navigateur hors GMod, ou ?demo
  function startDemo(){
    stopDemo();total=248;needed=248;statusFloor=0;shown=0;logIdx=0;logEl.innerHTML='';
    document.getElementById('mapName').textContent='rp_redzone_city';
    document.getElementById('plys').textContent='64';
    var done=0;
    (function tick(){
      if(Math.random()>.18)done=Math.min(total,done+Math.round((Math.random()*7+1)*demoSpeed));
      needed=total-done;
      if(done<total)demo=setTimeout(tick,120);
    })();
  }
  if(/[?&]demo/.test(location.search)){
    document.getElementById('demoBox').hidden=false;
    document.getElementById('bRestart').onclick=function(){realMode=false;startDemo();};
    document.getElementById('bSlow').onclick=function(){demoSpeed=.35;realMode=false;startDemo();};
    document.getElementById('bFast').onclick=function(){demoSpeed=1;realMode=false;startDemo();};
  }
  loop();
  setTimeout(function(){if(!realMode&&!demo)startDemo();},2500);
})();
</script></body></html>
